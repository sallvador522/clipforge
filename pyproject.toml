[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.1.0"
description = "Voice-first AI video editing agent (mock-first development)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "Pillow>=10,<12",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
# Renderer milestone will add: opencv-python-headless, fastapi, uvicorn (apps/api, apps/worker).

[tool.pytest.ini_options]
pythonpath = [
    "packages/contracts",
    "packages/providers",
    "apps/worker",
    "apps/api",
]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["packages/contracts", "packages/providers", "apps/worker", "apps/api"]
