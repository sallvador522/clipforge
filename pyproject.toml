[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.1.0"
description = "Voice-first AI video editing agent (mock-first development)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "Pillow>=10,<12",
    "numpy>=1.26",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "psutil>=5.9"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9"]
worker = ["opencv-python-headless>=4.8,<5"]

[tool.pytest.ini_options]
pythonpath = [
    "packages/contracts",
    "packages/providers",
    "packages/jobs",
    "apps/worker",
    "apps/api",
]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["packages/contracts", "packages/providers", "packages/jobs", "apps/worker", "apps/api"]
